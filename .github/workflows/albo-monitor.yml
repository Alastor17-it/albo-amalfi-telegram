name: Albo Pretorio Amalfi → Telegram

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: albo-amalfi-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Estrai progetto
        run: |
          rm -rf albo-amalfi-telegram-v3
          unzip -o albo-amalfi-telegram-v3.zip

      - name: Ripristina stato
        run: |
          if [ -f state.json ]; then
            cp state.json albo-amalfi-telegram-v3/state.json
          fi

      - name: Installa dipendenze
        working-directory: albo-amalfi-telegram-v3
        run: |
          npm install --no-audit --no-fund
          npm install --no-save playwright-extra puppeteer-extra-plugin-stealth
          npx playwright install --with-deps chromium

      - name: Applica modalità stealth e Topic Telegram
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("albo-amalfi-telegram-v3/monitor.mjs")
          text = path.read_text()

          text = text.replace(
              "import { chromium } from 'playwright';",
              """import { chromium } from 'playwright-extra';
          import StealthPlugin from 'puppeteer-extra-plugin-stealth';
          chromium.use(StealthPlugin());"""
          )

          if "TELEGRAM_THREAD_ID" not in text:
              text = text.replace(
                  "const TELEGRAM_CHAT_ID = process.env.TELEGRAM_CHAT_ID || '';",
                  """const TELEGRAM_CHAT_ID = process.env.TELEGRAM_CHAT_ID || '';
          const TELEGRAM_THREAD_ID = process.env.TELEGRAM_THREAD_ID || '';"""
              )

          if "message_thread_id" not in text:
              text = text.replace(
                  "chat_id: TELEGRAM_CHAT_ID,\n      text,",
                  """chat_id: TELEGRAM_CHAT_ID,
                ...(TELEGRAM_THREAD_ID
                  ? { message_thread_id: Number(TELEGRAM_THREAD_ID) }
                  : {}),
                text,"""
              )

          old = """await page.waitForSelector('a[href*="albo_dettagli.php?id="]', { timeout: 30000 });"""

          new = """
          try {
            await page.waitForSelector(
              'a[href*="albo_dettagli.php?id="]',
              { timeout: 45000 }
            );
          } catch (e) {
            console.log("===== DEBUG ALBO =====");
            console.log("URL:", page.url());
            console.log("TITLE:", await page.title());
            console.log(
              "BODY:",
              (await page.locator('body').innerText().catch(() => ''))
                .slice(0, 4000)
            );

            await page.screenshot({
              path: 'albo-debug.png',
              fullPage: true
            }).catch(() => {});

            throw new Error(
              "Albo non leggibile dal runner GitHub. Probabile blocco anti-bot/IP cloud."
            );
          }
          """

          text = text.replace(old, new)
          path.write_text(text)
          PY

      - name: Controlla Albo Pretorio
        working-directory: albo-amalfi-telegram-v3
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
        run: npm run check

      - name: Carica diagnostica
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: albo-debug
          path: albo-amalfi-telegram-v3/albo-debug.png
          if-no-files-found: ignore

      - name: Recupera nuovo stato
        if: always()
        run: |
          if [ -f albo-amalfi-telegram-v3/state.json ]; then
            cp albo-amalfi-telegram-v3/state.json state.json
          fi

      - name: Salva stato
        if: always()
        run: |
          if [ ! -f state.json ]; then
            exit 0
          fi

          git config user.name "albo-amalfi-bot"
          git config user.email "albo-amalfi-bot@users.noreply.github.com"

          git add state.json

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "chore: aggiorna stato Albo"
          git push
